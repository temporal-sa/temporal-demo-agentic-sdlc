<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Supply Co.</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/telemetry.js"></script>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand"><span aria-hidden="true">🪐</span> Orbit Supply Co.</div>
      <div class="cart-pill">Cart <span id="cart-count">0</span></div>
    </header>
    <main class="layout">
      <section aria-labelledby="shop-heading">
        <h1 id="shop-heading">Gear for the long haul</h1>
        <div id="products" class="grid"></div>
      </section>
      <aside class="cart" aria-labelledby="cart-heading">
        <h2 id="cart-heading">Your cart</h2>
        <p id="empty" class="muted">Your cart is empty.</p>
        <ul id="cart-items"></ul>
        <dl class="totals">
          <dt>Subtotal</dt><dd id="subtotal">$0.00</dd>
          <dt>Tax</dt><dd id="tax">$0.00</dd>
          <dt class="total">Total</dt><dd id="total" class="total">$0.00</dd>
        </dl>
        <button type="button" class="checkout">Checkout</button>
      </aside>
    </main>
  </body>
</html>
