[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "AI agents take a GitHub issue to a canaried production deploy, orchestrated by Temporal."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "temporalio==1.34.0",
    "temporal-agent-harness[pydantic-ai,redis] @ git+https://github.com/temporal-sa/temporal-agent-harness@f12f194d6f828dd7bc3b9afff2b1106bd0bf947a#subdirectory=python",
    "pydantic-ai-slim[anthropic,google,openai,temporal]==2.14.1",
    # Pydantic AI 2.14.1 predates these SDKs' next majors; versions match the ones
    # temporal-demo-advanced-ai-agent runs with the same Pydantic AI.
    "anthropic==0.125.0",
    "openai==3.8.0",
    "google-genai==2.7.0",
    "pydantic>=2.13",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.47",
    "httpx>=0.28",
    "redis>=6.4",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.26", "python-pptx>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_sdlc*"]
